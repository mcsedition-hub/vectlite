name: Publish Node Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prebuilds:
    name: "${{ matrix.os }} / ${{ matrix.prebuild }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            prebuild: linux-x64-gnu
          - os: macos-15-intel
            prebuild: darwin-x64
          - os: macos-14
            prebuild: darwin-arm64
          - os: windows-latest
            prebuild: win32-x64-msvc
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Show tool versions
        working-directory: bindings/node
        run: |
          node --version
          npm --version
          cargo --version

      - name: Run Node smoke tests
        working-directory: bindings/node
        run: npm test

      - name: Stage platform prebuilt
        working-directory: bindings/node
        env:
          VECTLITE_PREBUILD_TAG: ${{ matrix.prebuild }}
        run: node ./scripts/stage-prebuilt.mjs

      - name: Upload platform prebuilt
        uses: actions/upload-artifact@v6
        with:
          name: prebuild-${{ matrix.prebuild }}
          path: bindings/node/prebuilds/${{ matrix.prebuild }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [prebuilds]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check Node package version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: bindings/node
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "bindings/node/package.json version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)."
            exit 1
          fi

      - name: Download platform prebuilds
        uses: actions/download-artifact@v7
        with:
          pattern: prebuild-*
          path: dist/node-prebuilds

      - name: Assemble platform prebuilds
        working-directory: bindings/node
        run: node ./scripts/collect-prebuilds.mjs ../../dist/node-prebuilds

      - name: Validate npm tarball
        working-directory: bindings/node
        run: npm pack --dry-run

      - name: Publish to npm with trusted publishing
        working-directory: bindings/node
        run: npm publish
