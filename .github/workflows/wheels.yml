name: Build wheels

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install maturin
      - name: Build sdist
        run: maturin sdist -m bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: "${{ matrix.os }} / ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS x86_64
          - os: macos-15-intel
            target: x86_64
          # macOS arm64 (Apple Silicon)
          - os: macos-14
            target: aarch64
          # Windows x86_64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release -m bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: "dist-${{ matrix.os }}-${{ matrix.target }}"
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Check Python package version matches the release tag
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          WORKSPACE_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#py-v}"
          if [ "$WORKSPACE_VERSION" != "$TAG_VERSION" ]; then
            echo "workspace version ($WORKSPACE_VERSION) does not match tag ($TAG_VERSION)."
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI with API token
        if: env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI with trusted publishing
        if: env.HAS_PYPI_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
