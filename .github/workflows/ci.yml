name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust / fmt + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        run: cargo test --workspace

  python:
    name: Python / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ensure Cargo is on PATH
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install package in editable mode
        run: python -m pip install -e bindings/python

      - name: Run Python tests
        run: python -m pytest bindings/python/tests -q

  node:
    name: Node / ${{ matrix.os }} / node${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "20"
          - os: macos-14
            node-version: "20"
          - os: windows-latest
            node-version: "20"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: Swatinem/rust-cache@v2

      - name: Run Node smoke tests
        working-directory: bindings/node
        run: npm test

  packaging:
    name: Python packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      - name: Install build tooling
        run: python -m pip install --upgrade pip maturin twine

      - name: Build wheel
        run: maturin build -m bindings/python/Cargo.toml --release --out dist

      - name: Build sdist
        run: maturin sdist -m bindings/python/Cargo.toml --out dist

      - name: Check distributions
        run: twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*
