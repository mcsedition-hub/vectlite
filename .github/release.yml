changelog:
  exclude:
    labels:
      - ignore-for-release
      - chore
      - duplicate
      - invalid
      - question
      - wontfix
    authors:
      - github-actions[bot]
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - bugfix
        - fix
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Maintenance
      labels:
        - ci
        - dependencies
        - refactor
    - title: Other Changes
      labels:
        - "*"
