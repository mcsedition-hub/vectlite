[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "vectlite"
description = "Embedded vector store for local-first AI applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/mcsedition-hub/vectlite"
Repository = "https://github.com/mcsedition-hub/vectlite"
Issues = "https://github.com/mcsedition-hub/vectlite/issues"
Changelog = "https://github.com/mcsedition-hub/vectlite/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "vectlite._vectlite"
python-source = "."
